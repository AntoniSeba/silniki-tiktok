<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V6 shorts loop 1080x1920</title>
    <style>
      :root {
        --ink: #f4f7fb;
        --accent: #4a9bff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07090b;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1080px;
        height: 1920px;
        transform-origin: center center;
        background: #05070a;
        overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
        border-radius: 6px;
      }
      #viewport { position: absolute; inset: 0; }
      canvas { display: block; }
      .vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 46%, rgba(0, 0, 0, 0) 46%, rgba(0, 0, 0, 0.5) 100%);
        pointer-events: none;
      }
      /* TikTokUI dead zones, for reference while framing the shot */
      .guides { position: absolute; inset: 0; display: none; }
      body.safe-on .guides { display: block; }
      .guides .zone {
        position: absolute;
        background: repeating-linear-gradient(45deg, rgba(255, 60, 60, 0.14) 0 12px, rgba(255, 60, 60, 0.06) 12px 24px);
        border: 2px dashed rgba(255, 90, 90, 0.45);
      }
      .guides .top { left: 0; top: 0; width: 1080px; height: 300px; }
      .guides .bottom { left: 0; top: 1360px; width: 1080px; height: 560px; }
      .guides .right { left: 900px; top: 300px; width: 180px; height: 1060px; }
      .guides span {
        position: absolute;
        left: 22px;
        top: 16px;
        font: 600 28px/1.2 -apple-system, sans-serif;
        color: rgba(255, 120, 120, 0.8);
        letter-spacing: 0.06em;
      }
      .bar {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(14, 18, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 13px;
        z-index: 50;
      }
      .bar button {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
      }
      .bar button:hover { background: rgba(255, 255, 255, 0.16); }
      .bar label { display: flex; align-items: center; gap: 6px; color: #9ba6b4; }
      input[type="range"] { width: 300px; accent-color: var(--accent); }
      .hint { color: #7f8a98; font-size: 12px; }
      #rec.on { background: #d63a3a; border-color: #ff6a6a; color: #fff; }

      /* ---------------- podpisy czesci ---------------- */
      .labels { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      .label { position: absolute; left: 0; top: 0; }
      .label-dot {
        position: absolute;
        width: 10px; height: 10px; margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: #ffd24a;
        box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.25);
      }
      .label-line {
        position: absolute;
        height: 2px; width: 46px;
        background: linear-gradient(90deg, rgba(255, 210, 74, 0.6), rgba(255, 210, 74, 0.95));
      }
      .label-text {
        position: absolute;
        white-space: nowrap;
        padding: 7px 13px;
        font-size: 21px;
        font-weight: 600;
        color: #0d0f13;
        background: #ffd24a;
        border-radius: 7px;
        letter-spacing: 0.01em;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage">
      <div id="viewport"></div>
      <div class="vig"></div>
      <div class="guides">
        <div class="zone top"><span>UI TIKTOK</span></div>
        <div class="zone bottom"><span>OPIS I PRZYCISKI</span></div>
        <div class="zone right"><span>PASEK</span></div>
      </div>
    </div>

    <div class="bar">
      <button id="play">PAUZA</button>
      <button id="restart">OD NOWA</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" />
      <button id="rec">NAGRAJ WEBM</button>
      <button id="png">PNG</button>
      <label><input type="checkbox" id="safe" /> strefy tiktok</label>
      <span class="hint">spacja: pauza, R: od nowa, S: strefy</span>
    </div>

    <script type="module" src="./src/tiktok-main.js"></script>
  </body>
</html>
