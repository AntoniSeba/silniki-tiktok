<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.0 turbo R3 model</title>
<style>
  :root { --bg: #0d1013; --panel: rgba(18, 22, 27, 0.86); --ink: #e8edf2; --dim: #8b96a3; --acc: #ff5a1f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #ui { position: fixed; left: 16px; top: 16px; width: 260px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid #262d35; border-radius: 10px; padding: 14px 16px; box-sizing: border-box; }
  #ui h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: 0.04em; }
  #ui h1 b { color: var(--acc); }
  #ui p { margin: 0 0 12px; color: var(--dim); font-size: 12px; }
  label { display: block; margin: 10px 0 2px; color: var(--dim); font-size: 12px; }
  label span { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  button { background: #1c232b; color: var(--ink); border: 1px solid #2f3842; border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: var(--acc); color: #fff; }
  #read { margin-top: 12px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
  <h1>TOYOTA <b>1.0 turbo R3</b></h1>
  <p>R3, 3 cylindry, jedna turbina (wariant modelu 2JZ)</p>
  <label>Obroty <span id="rpmV">900</span></label>
  <input id="rpm" type="range" min="0" max="7200" step="50" value="900">
  <label>Rozłożenie <span id="expV">0%</span></label>
  <input id="exp" type="range" min="0" max="1" step="0.01" value="0">
  <div class="row">
    <button id="bCover">Osłona rozrządu</button>
    <button id="bSkin" class="on">Obudowy</button>
    <button id="bInd" class="on">Dolot i turbo</button>
    <button id="bSpin" class="on">Obrót kamery</button>
  </div>
  <div id="read"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./r3/main.js"></script>
</body>
</html>
