    <style>
      :root {
        --fg: #eef2f7;
        --fg-2: #b6c1cf;
        --fg-3: #77828f;
        --hot: #ff6a28;
        --cold: #4fb8ff;
        --oil: #f5aa3c;
        --ok: #5fb87a;
        --hair: rgba(150, 165, 182, 0.28);
        --sans: Oswald, "Arial Narrow", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

        margin: 0;
        background: #05070a;
        overflow: hidden;
        font-family: var(--sans);
      }

      #root {

        width: 100%;
        height: 100%;

      #grid {
        position: absolute;
        inset: 0;

          linear-gradient(to bottom, rgba(150, 165, 182, 0.05) 1px, transparent 1px);
        background-size: 90px 90px;
        -webkit-mask-image: radial-gradient(70% 44% at 50% 44%, #000 0%, transparent 80%);
        mask-image: radial-gradient(70% 44% at 50% 44%, #000 0%, transparent 80%);
      }
      #gl {
        position: absolute;
        left: 0;
        top: -80px;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      #svg {

      /* ---------------- nawigacja ---------------- */

          3px 3px 3px #000, -3px 3px 3px #000, 3px -3px 3px #000, -3px -3px 3px #000,

      .cap span { display: inline-block; }
      .cap b { color: var(--oil); font-weight: 600; }

      /* warstwa grafiki chowana na czas hooka */
      #ui {
        position: absolute;
        inset: 0;
        z-index: 5;
        opacity: 0;

      #ui::before {
        content: "";

        left: 0;
        right: 0;
        top: 0;

          to bottom,

      #ui::after {

          to top,
          rgba(6, 8, 11, 0.9) 0%,

      }
      #top,
      #hud,
      #note,
      #lines {
        z-index: 1;
      }

      .tag { z-index: 6; }
    </style>

      <!-- warstwa graficzna, w hooku wygaszona do zera -->
      <div id="ui">

        <div id="hud">

    <script>
      (function () {
        "use strict";

        var stage = document.getElementById("root");
        if (typeof THREE === "undefined") return;

        var W = 1080,
          H = 1920;

        /* =====================================================================
           GEOMETRIA
           Oś wału leży wzdłuż X. Strona gorąca (turbina) na -X, zimna
           (sprężarka) na +X. Powietrze wchodzi osiowo od +X, spaliny
           wychodzą osiowo w -X. To jest prawdziwy układ, nie stylizacja.
           ===================================================================== */
        var X_TURB = -1.35, // środek wirnika turbiny
          X_COMP = 1.35, // środek wirnika sprężarki
          R_TIP = 0.62, // promień zewnętrzny wirników
          R_HUB = 0.19; // promień piasty przy osi

        /* ---- wirnik o przepływie promieniowym -------------------------------
           dir = -1 : turbina  (wlot promieniowy R_TIP -> wylot osiowy R_HUB)
           dir = +1 : sprężarka(wlot osiowy R_HUB -> wylot promieniowy R_TIP)
           Kierunek wysokości łopatki obraca się z osiowego na promieniowy,
           bo tak obraca się kierunek przepływu.                              */
        function wheelBlades(opts) {
          var N = opts.count,
            NM = 18,
            NH = 5;
          var pos = [],
            idx = [];
          var vert = 0;
          for (var b = 0; b < N; b++) {
            var th0 = (b / N) * Math.PI * 2;
            var base = vert;
            for (var i = 0; i <= NM; i++) {
              var m = i / NM;
              var sm = m * m * (3 - 2 * m); // wygładzenie promienia
              var r0 = opts.rIn + (opts.rOut - opts.rIn) * sm;
              var x0 = opts.xIn + (opts.xOut - opts.xIn) * m;
              // kierunek wysokości łopatki: promieniowy -> osiowy
              var k = (Math.PI / 2) * (opts.flip ? 1 - m : m);
              var dr = Math.cos(k),
                dx = Math.sin(k) * opts.hSign;
              var th = th0 + opts.wrap * sm; // odgięcie łopatki
              for (var h = 0; h <= NH; h++) {
                var hh = h / NH;
                var r = r0 + hh * opts.height * dr;
                var x = x0 + hh * opts.height * dx;
                pos.push(x, Math.cos(th) * r, Math.sin(th) * r);
                vert++;
              }
            }
            for (var i2 = 0; i2 < NM; i2++) {
              for (var h2 = 0; h2 < NH; h2++) {
                var a = base + i2 * (NH + 1) + h2,
                  c = a + (NH + 1);
                idx.push(a, c, a + 1, a + 1, c, c + 1);
              }
            }
          }
          var g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setIndex(idx);
          g.computeVertexNormals();
          return g;
        }

        /* ---- piasta wirnika: obrót profilu meridionalnego ---- */
        function hubGeometry(xIn, xOut, rIn, rOut, flip) {
          var pts = [];
          for (var i = 0; i <= 24; i++) {
            var m = i / 24,
              sm = m * m * (3 - 2 * m);
            var r = rIn + (rOut - rIn) * sm;
            var x = xIn + (xOut - xIn) * m;
            pts.push(new THREE.Vector2(Math.max(0.02, r * (flip ? 0.55 : 0.5)), x));
          }
          var g = new THREE.LatheGeometry(pts, 48);
          g.rotateZ(Math.PI / 2); // oś Lathe z Y na X
          return g;
        }

        /* ---- ślimak: rura o malejącym przekroju prowadzona po spirali ----
           To jest sedno obudowy. Przekrój maleje wraz z kątem, bo gaz po
           drodze ucieka do wirnika i zostaje go coraz mniej.                */
        function voluteGeometry(o) {
          var NP = 120,
            NT = 20;
          var pos = [],
            idx = [];
          for (var i = 0; i <= NP; i++) {
            var f = i / NP;
            var phi = o.phi0 + (o.phi1 - o.phi0) * f;
            var R = o.R0 + o.spiral * f; // promień prowadnicy
            var a = o.a0 * (1 - o.taper * f); // promień przekroju
            var cy = Math.cos(phi) * R,
              cz = Math.sin(phi) * R;
            // lokalna ramka: promieniowa i osiowa
            var ur = [0, Math.cos(phi), Math.sin(phi)];
            var ux = [1, 0, 0];
            for (var j = 0; j <= NT; j++) {
              var t = (j / NT) * Math.PI * 2;
              var ca = Math.cos(t) * a,
                sa = Math.sin(t) * a;
              pos.push(
                o.x + ux[0] * sa,
                cy + ur[1] * ca,
                cz + ur[2] * ca
              );
            }
          }
          for (var i2 = 0; i2 < NP; i2++) {
            for (var j2 = 0; j2 < NT; j2++) {
              var A = i2 * (NT + 1) + j2,
                C = A + (NT + 1);
              idx.push(A, C, A + 1, A + 1, C, C + 1);
            }
          }
          var g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setIndex(idx);
          g.computeVertexNormals();
          return g;
        }

        /* =====================================================================
           SCENA
           ===================================================================== */
        var canvas = document.getElementById("gl");
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(W, H, false);
        renderer.setPixelRatio(1);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.LinearToneMapping;
        renderer.toneMappingExposure = 0.95;

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);

        scene.add(new THREE.HemisphereLight(0x93aecb, 0x0b0f14, 0.5));
        var key = new THREE.DirectionalLight(0xe4eefa, 1.5);
        key.position.set(-2.5, 5, 6);
        scene.add(key);
        var fill = new THREE.DirectionalLight(0x6f97c2, 0.9);
        fill.position.set(5, -2, -4);
        scene.add(fill);
        var hotLight = new THREE.PointLight(0xff5a14, 0, 9, 2);
        hotLight.position.set(X_TURB, 0, 0);
        scene.add(hotLight);
        var coldLight = new THREE.PointLight(0x3aa8ff, 0, 9, 2);
        coldLight.position.set(X_COMP, 0, 0);
        scene.add(coldLight);

        var turbo = new THREE.Group();
        scene.add(turbo);

        /* ---- materiały ---- */
        var matHotShell = new THREE.MeshStandardMaterial({
          color: 0x6d4034,
          metalness: 0.75,
          roughness: 0.55,
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        var matColdShell = new THREE.MeshStandardMaterial({
          color: 0x7e8a99,
          metalness: 0.8,
          roughness: 0.4,
          transparent: true,
          opacity: 0.3,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        var matTurbWheel = new THREE.MeshStandardMaterial({
          color: 0x8c8378,
          metalness: 0.92,
          roughness: 0.34,
          side: THREE.DoubleSide,
          emissive: 0x2a0a00,
          emissiveIntensity: 0,
        });
        var matCompWheel = new THREE.MeshStandardMaterial({
          color: 0xc3ccd6,
          metalness: 0.95,
          roughness: 0.22,
          side: THREE.DoubleSide,
        });
        var matCenter = new THREE.MeshStandardMaterial({
          color: 0x5b6573,
          metalness: 0.85,
          roughness: 0.42,
        });
        var matShaft = new THREE.MeshStandardMaterial({
          color: 0xd6dde5,
          metalness: 0.97,
          roughness: 0.16,
        });

        /* ---- wirnik turbiny: wlot promieniowy -> wylot osiowy ---- */
        var turbWheel = new THREE.Group();
        turbWheel.add(
          new THREE.Mesh(
            wheelBlades({
              count: 11,
              rIn: R_TIP,
              rOut: R_HUB + 0.08,
              xIn: X_TURB + 0.16,
              xOut: X_TURB - 0.3,
              height: 0.2,
              hSign: -1,
              wrap: -0.55,
              flip: true,
            }),
            matTurbWheel
          )
        );
        turbWheel.add(
          new THREE.Mesh(
            hubGeometry(X_TURB + 0.16, X_TURB - 0.3, R_TIP, R_HUB + 0.08, true),
            matTurbWheel
          )
        );
        turbo.add(turbWheel);

        /* ---- wirnik sprężarki: wlot osiowy -> wylot promieniowy ---- */
        var compWheel = new THREE.Group();
        compWheel.add(
          new THREE.Mesh(
            wheelBlades({
              count: 7,
              rIn: R_HUB + 0.04,
              rOut: R_TIP,
              xIn: X_COMP + 0.3,
              xOut: X_COMP - 0.14,
              height: 0.22,
              hSign: 1,
              wrap: -0.95,
              flip: false,
            }),
            matCompWheel
          )
        );
        compWheel.add(
          new THREE.Mesh(
            hubGeometry(X_COMP + 0.3, X_COMP - 0.14, R_HUB + 0.04, R_TIP * 0.42, false),
            matCompWheel
          )
        );
        turbo.add(compWheel);

        /* ---- ślimaki ---- */
        var voluteHot = new THREE.Mesh(
          voluteGeometry({
            x: X_TURB + 0.05,
            R0: 1.37,
            spiral: -0.42,
            a0: 0.3,
            taper: 0.5,
            phi0: 0.15,
            phi1: Math.PI * 2 * 0.97,
          }),
          matHotShell
        );
        turbo.add(voluteHot);
        var voluteCold = new THREE.Mesh(
          voluteGeometry({
            x: X_COMP - 0.02,
            R0: 1.37,
            spiral: -0.42,
            a0: 0.29,
            taper: 0.48,
            phi0: 0.15,
            phi1: Math.PI * 2 * 0.97,
          }),
          matColdShell
        );
        turbo.add(voluteCold);

        /* ---- króćce: wlot spalin i wylot sprężonego powietrza ---- */
        function snout(x, len, r, mat, dirY) {
          var g = new THREE.CylinderGeometry(r, r * 1.08, len, 28, 1, true);
          var m = new THREE.Mesh(g, mat);
          m.position.set(x, dirY * (1.37 + len / 2) * 0.72, 0);
          m.rotation.z = 0;
          return m;

        var hotIn = snout(X_TURB + 0.05, 0.95, 0.3, matHotShell, 1);

        // tor spalin: rura -> ślimak -> promieniowo do środka -> osiowo w -X
        function exhaustPoint(p, out) {
          var x = X_TURB + 0.05,
            r,
            th;
          if (p < 0.2) {
            // rura wlotowa: gaz schodzi z kolektora do ślimaka
            var u = p / 0.2;
            th = 0.15;
            r = 2.65 - u * 1.28;
          } else if (p < 0.66) {
            // ślimak: owija wirnik, promień maleje bo gazu ubywa
            var u2 = (p - 0.2) / 0.46;
            th = 0.15 + u2 * Math.PI * 1.94;
            r = 1.37 - u2 * 0.42;
          } else if (p < 0.85) {
            // wejście promieniowe w łopatki i skręt na oś
            var u3 = (p - 0.66) / 0.19;
            th = 0.15 + Math.PI * 1.94 + u3 * 2.4;
            r = 0.95 - u3 * 0.62;
            x = X_TURB + 0.16 - u3 * 0.34;
          } else {
            // wylot osiowy w wydech
            var u4 = (p - 0.85) / 0.15;
            th = 0.15 + Math.PI * 1.94 + 2.4 + u4 * 1.2;
            r = 0.33 * (1 - u4 * 0.4);
            x = X_TURB - 0.18 - u4 * 1.5;
          }
          out.set(x, Math.cos(th) * r, Math.sin(th) * r);
          return p;
        }

        // tor powietrza: osiowo od +X -> wirnik -> promieniowo w ślimak -> rura
        function airPoint(p, out) {

            th = u * 2.4;
          } else if (p < 0.5) {

            var u2 = (p - 0.22) / 0.28;
            x = X_COMP + 0.46 - u2 * 0.48;
            r = 0.24 + u2 * u2 * 0.71;

            x = X_COMP - 0.02;
            th = 7.4 + u3 * (TH_END - 7.4);
            r = 0.95 + u3 * 0.42;
          } else {
            // rura wylotowa do chłodnicy
            var u4 = (p - 0.82) / 0.18;
            x = X_COMP - 0.02;
            th = TH_END;
            r = 1.37 + u4 * 1.28;
          }
          out.set(x, Math.cos(th) * r, Math.sin(th) * r);
          return p;
        }

        function updateParticles(t, exFlow, airFlow, chill) {
          var ap = pEx.geometry.attributes.position.array,
            ac = pEx.geometry.attributes.color.array;
          for (var i = 0; i < N_EX; i++) {
            var ph = ((i * 0.61803398875 + t * 0.19 * exFlow) % 1 + 1) % 1;
            exhaustPoint(ph, tmpV);
            ap[i * 3] = tmpV.x;
            ap[i * 3 + 1] = tmpV.y;
            ap[i * 3 + 2] = tmpV.z;
            tmpC.copy(cHotB).lerp(cHotA, ph > 0.62 ? 0 : 1 - ph);
            var fade = exFlow * (ph > 0.94 ? (1 - ph) / 0.06 : 1);
            ac[i * 3] = tmpC.r * fade;
            ac[i * 3 + 1] = tmpC.g * fade;
            ac[i * 3 + 2] = tmpC.b * fade;
          }
          pEx.geometry.attributes.position.needsUpdate = true;
          pEx.geometry.attributes.color.needsUpdate = true;

          var bp = pAir.geometry.attributes.position.array,
            bc = pAir.geometry.attributes.color.array;
          for (var j = 0; j < N_AIR; j++) {
            var ph2 = ((j * 0.7548776662 + t * 0.21 * airFlow) % 1 + 1) % 1;
            airPoint(ph2, tmpV);
            bp[j * 3] = tmpV.x;
            bp[j * 3 + 1] = tmpV.y;
            bp[j * 3 + 2] = tmpV.z;
            // zimne na wlocie, gorące po sprężeniu, znowu zimne po chłodnicy

            tmpC.copy(cCold).lerp(cWarm, heat);
            if (chill > 0 && ph2 > 0.8) tmpC.lerp(cChill, chill);
            var fade2 = airFlow * (ph2 > 0.95 ? (1 - ph2) / 0.05 : 1);
            bc[j * 3] = tmpC.r * fade2;
            bc[j * 3 + 1] = tmpC.g * fade2;
            bc[j * 3 + 2] = tmpC.b * fade2;
          }
          pAir.geometry.attributes.position.needsUpdate = true;
          pAir.geometry.attributes.color.needsUpdate = true;
        }

          SCENES[si].d = SCENES[si].end - STARTS[si];
          if (si + 1 < SCENES.length) STARTS.push(SCENES[si].end);
        }
        var TOTAL = SCENES[SCENES.length - 1].end;
        SCENES.forEach(function (sc) {
          if (!sc.cam2) {
            sc.cam2 = {
              d: sc.cam.d * 0.9,
              yaw: sc.cam.yaw + (sc.cam.yaw >= 0 ? 11 : -11),
              pitch: sc.cam.pitch - 3,
              tx: sc.cam.tx,
              ty: sc.cam.ty,
            };
          }
        });
        // Rytm ujęć: kamera przeskakuje na każdej linii lektora, a gdy przerwa
        // między zdaniami przekracza 3,2 s, dokładany jest przeskok pośredni.
        var MAXSHOT = 3.2;
        SCENES.forEach(function (sc, si) {
          var t0 = si === 0 ? 0 : SCENES[si - 1].end;
          var beats = sc.lines.length ? sc.lines.map(function (l) { return l[0]; }) : [t0];
          if (beats[0] > t0 + 0.4) beats.unshift(t0);
          var full = [];
          for (var k = 0; k < beats.length; k++) {
            full.push(beats[k]);
            var nxt = k + 1 < beats.length ? beats[k + 1] : sc.end;
            var gap = nxt - beats[k];
            if (gap > MAXSHOT) {
              var steps = Math.ceil(gap / MAXSHOT) - 1;
              for (var q = 1; q <= steps; q++) full.push(beats[k] + (gap * q) / (steps + 1));
            }
          }
          full.sort(function (a, b) { return a - b; });
          sc.shots = full;
        });
        function shotPose(sc, k, n) {
          var e = n > 1 ? k / (n - 1) : 0;
          var a = sc.cam,
            b = sc.cam2;
          var sway = k % 2 === 0 ? 1 : -1;
          var pull = k % 3 === 0 ? 1.0 : k % 3 === 1 ? 0.87 : 1.08;
          return {
            d: (a.d + (b.d - a.d) * e) * pull,
            yaw: a.yaw + (b.yaw - a.yaw) * e + sway * 13,
            pitch: a.pitch + (b.pitch - a.pitch) * e - sway * 3.5,
            tx: a.tx + (b.tx - a.tx) * e,
            ty: a.ty + (b.ty - a.ty) * e,
          };
        }
        function camAtTime(tt) {
          var i = sceneIndexAt(tt),
            sc = SCENES[i],
            sh = sc.shots,
            n = sh.length;
          var k = 0;
          while (k < n - 1 && tt >= sh[k + 1]) k++;
          var cur = shotPose(sc, k, n);
          var prevPose = k > 0 ? shotPose(sc, k - 1, n) : cur;
          // szybkie dojście do nowego ujęcia, potem lekki dryf w jego obrębie
          var e = easeIO(clamp01((tt - sh[k]) / 0.42));
          var nxt = k + 1 < n ? sh[k + 1] : sc.end;
          var drift = clamp01((tt - sh[k]) / Math.max(0.6, nxt - sh[k]));
          return {
            d: (prevPose.d + (cur.d - prevPose.d) * e) * (1 - drift * 0.045),
            yaw: prevPose.yaw + (cur.yaw - prevPose.yaw) * e + drift * 4.5,
            pitch: prevPose.pitch + (cur.pitch - prevPose.pitch) * e,
            tx: prevPose.tx + (cur.tx - prevPose.tx) * e,
            ty: prevPose.ty + (cur.ty - prevPose.ty) * e,
          };
        }
        function camAt(i, prog) {
          var a = SCENES[i].cam,
            b = SCENES[i].cam2,
            e = easeIO(prog);
          return {
            d: a.d + (b.d - a.d) * e,
            yaw: a.yaw + (b.yaw - a.yaw) * e,
            pitch: a.pitch + (b.pitch - a.pitch) * e,
            tx: a.tx + (b.tx - a.tx) * e,
            ty: a.ty + (b.ty - a.ty) * e,
          };
        }

        /* ---- elementy tekstowe ---- */
        var elKick = document.getElementById("kicker"),
          elHead = document.getElementById("head"),
          elRpm = document.getElementById("v-rpm"),
          elBoost = document.getElementById("v-boost"),
          elTemp = document.getElementById("v-temp"),
          svg = document.getElementById("svg");
        var tagEls = [];

        function clamp01(v) {
          return v < 0 ? 0 : v > 1 ? 1 : v;
        }
        function easeIO(p) {
          return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        }
        function easeOut(p) {
          return 1 - Math.pow(1 - p, 3);
        }
        function lerp(a, b, p) {
          return a + (b - a) * p;
        }
        function plNum(v, dec) {
          return v.toFixed(dec).replace(".", ",");
        }
        function spaced(n) {
          return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        function sceneIndexAt(tt) {
          var i = 0;
          while (i < SCENES.length - 1 && tt >= STARTS[i + 1]) i++;
          return i;
        }
        function valAt(tt, key, def) {
          var i = sceneIndexAt(tt),
            sc = SCENES[i],
            pv = SCENES[Math.max(0, i - 1)];
          var mix = easeIO(clamp01((tt - STARTS[i]) / 1.1));
          var b = sc[key] === undefined ? def : sc[key];
          var a = i === 0 ? b : pv[key] === undefined ? def : pv[key];
          return a + (b - a) * mix;
        }
        var ANGTAB = (function () {
          var dt = 1 / 120,
            n = Math.ceil(TOTAL / dt) + 2,
            tab = new Float64Array(n),
            acc = 0;
          for (var k = 1; k < n; k++) {
            acc += (valAt(k * dt, "rpm", 0) / 60 / 9000) * Math.PI * 2 * dt * 60;
            tab[k] = acc;
          }
          return { dt: dt, tab: tab };
        })();
        function angleAtTime(tt) {
          if (tt <= 0) return 0;
          var x = tt / ANGTAB.dt,
            i0 = Math.floor(x);
          if (i0 >= ANGTAB.tab.length - 1) return ANGTAB.tab[ANGTAB.tab.length - 1];
          var f = x - i0;
          return ANGTAB.tab[i0] * (1 - f) + ANGTAB.tab[i0 + 1] * f;
        }

        var curScene = -1,
          lineEls = [];
        var elLines = document.getElementById("lines");
        function setText(i) {
          var sc = SCENES[i];
          elKick.textContent = sc.kick;
          elHead.innerHTML = sc.head;

          elLines.innerHTML = "";
          lineEls = sc.lines.map(function (ln) {
            var d = document.createElement("div");
            d.className = "ln";
            d.innerHTML = ln[1];
            elLines.appendChild(d);
            return { el: d, at: ln[0] };
          });

          tagEls.forEach(function (o) {
            o.el.remove();
            o.line.remove();
            o.dot.remove();
          });
          tagEls = [];
          (sc.tags || []).forEach(function (tg, k) {
            var col = tg.c === "hot" ? "#ff6a28" : tg.c === "cold" ? "#4fb8ff" : "#f5aa3c";
            var el = document.createElement("div");
            el.className = "tag " + (tg.c || "");
            el.textContent = tg.t;
            stage.appendChild(el);
            var ln = document.createElementNS("http://www.w3.org/2000/svg", "path");
            ln.setAttribute("fill", "none");
            ln.setAttribute("stroke", col);
            ln.setAttribute("stroke-width", "2");
            ln.setAttribute("opacity", "0.8");
            svg.appendChild(ln);
            var dt = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            dt.setAttribute("r", "5");
            dt.setAttribute("fill", col);
            svg.appendChild(dt);
            tagEls.push({ el: el, line: ln, dot: dt, p: tg.p, off: tg.off || [0, -120], k: k, at: tg.at || 0 });
          });
        }

        var projV = new THREE.Vector3();
        function project(x, y, z) {
          projV.set(x, y, z).project(camera);
          return { x: (projV.x * 0.5 + 0.5) * W, y: (-projV.y * 0.5 + 0.5) * H - 80 };
        }

        /* ---- stan ciągły, interpolowany między scenami ---- */
        var st = { ex: 0, air: 0, rpm: 0, boost: 0, temp: 20, hot: 0, wg: 0, oil: 0, showPath: 0 };
        var cam = { d: 7.48, yaw: 34, pitch: 16, tx: 0, ty: 0.1 };

        function frame(t) {
          // która scena i jak daleko w niej jesteśmy
          var i = 0;
          while (i < SCENES.length - 1 && t >= STARTS[i + 1]) i++;
          var s = SCENES[i];
          var local = t - STARTS[i];
          var prog = clamp01(local / s.d);
          if (i !== curScene) {
            curScene = i;
            setText(i);
          }

          // przejście: pierwsze 1.1 s sceny miksuje z poprzednią
          var prev = SCENES[Math.max(0, i - 1)];
          var mix = easeIO(clamp01(local / 1.1));
          function blend(key, def) {
            var a = prev[key] === undefined ? def : prev[key];
            var b = s[key] === undefined ? def : s[key];
            return lerp(i === 0 ? b : a, b, mix);
          }
          st.ex = blend("ex", 0);
          st.air = blend("air", 0);
          st.rpm = blend("rpm", 0);
          st.boost = blend("boost", 0);
          st.temp = blend("temp", 20);
          st.hot = blend("hot", 0);
          st.wg = blend("wg", 0);
          st.oil = blend("oil", 0);
          st.showPath = blend("showPath", 0);
          st.ui = blend("ui", 1);
          st.gl = blend("gl", 1);

          // każda scena ma własny ruch kamery: od cam do cam2
          var camA = camAtTime(t);
          cam.d = camA.d;
          cam.yaw = camA.yaw;
          cam.pitch = camA.pitch;
          cam.tx = camA.tx;
          cam.ty = camA.ty;

          var drift = Math.sin(t * 0.55) * 1.1;
          var yaw = ((cam.yaw + drift) * Math.PI) / 180,
            pitch = (cam.pitch * Math.PI) / 180;
          camera.position.set(
            cam.tx + Math.sin(yaw) * Math.cos(pitch) * cam.d,
            cam.ty + Math.sin(pitch) * cam.d,
            Math.cos(yaw) * Math.cos(pitch) * cam.d
          );
          camera.lookAt(cam.tx, cam.ty, 0);

          // obrót wirników: jeden wał, więc jeden kąt na obie strony.
          // Liczony z całki prędkości, żeby przewijanie dawało zawsze tę samą klatkę.
          var spinAngle = angleAtTime(t);
          turbWheel.rotation.x = spinAngle;
          compWheel.rotation.x = spinAngle;
          shaft.rotation.x = spinAngle;

          // rozgrzewanie strony gorącej
          matTurbWheel.emissiveIntensity = st.hot * 0.85;
          matTurbWheel.emissive.setHex(0x3d1000);
          matHotShell.color.setRGB(0.43 + st.hot * 0.18, 0.25, 0.2);
          matHotShell.opacity = 0.22 + 0.12 * (1 - st.hot);
          matColdShell.opacity = 0.34 - 0.08 * st.air;
          hotLight.intensity = st.hot * 2.6;
          coldLight.intensity = st.air * 1.2;
          matCenter.emissive = matCenter.emissive || new THREE.Color();
          matCenter.emissive.setRGB(st.oil * 0.16, st.oil * 0.09, 0);

          // wastegate: klapa się otwiera
          wgFlap.rotation.x = st.wg * 0.9;
          wgFlap.position.z = 0.18 + st.wg * 0.12;

          path.visible = st.showPath > 0.02;
          path.traverse(function (o) {
            if (o.material && o.material.transparent !== undefined) {
              o.material.transparent = true;
              o.material.opacity = st.showPath;
            }
          });

          updateParticles(t, st.ex, st.air, st.temp < 80 && st.showPath > 0.3 ? 1 : 0);

          // odczyty
          // lekkie drganie wskazań, żeby odczyty nigdy nie stały martwo
          var jit = Math.sin(t * 3.1) * 0.5 + Math.sin(t * 7.3) * 0.5;
          elRpm.textContent = spaced(st.rpm * (1 + jit * 0.008));
          elBoost.textContent = plNum(Math.max(0, st.boost * (1 + jit * 0.02)), 2);
          elTemp.textContent = String(Math.round(st.temp + jit * 0.9));

          // hook chowa całą warstwę graficzną i model
          document.getElementById("ui").style.opacity = st.ui;
          canvas.style.opacity = st.gl;

          // wejście nagłówka
          var tin = easeOut(clamp01(local / 0.7));
          document.getElementById("top").style.opacity = tin;
          document.getElementById("top").style.transform = "translateY(" + (1 - tin) * 16 + "px)";

          // jedna linia naraz, wchodzi dokładnie na swoje zdanie w lektorze
          lineEls.forEach(function (o, k) {
            var nxt = k + 1 < lineEls.length ? lineEls[k + 1].at : s.end + 9;
            var ap = easeOut(clamp01((t - o.at) / 0.34)) * (1 - clamp01((t - nxt) / 0.26));
            o.el.style.opacity = ap;
            o.el.style.transform = "translateX(" + (1 - ap) * 16 + "px)";
          });

          // wstawki b-rollowe zasłaniają model, więc wyniesienia na ten czas gasną
          var BR = [[12.66, 14.8], [90.78, 93.4], [119.52, 122.6]];
          var brollOn = 0;
          for (var bi = 0; bi < BR.length; bi++) {
            if (t > BR[bi][0] - 0.3 && t < BR[bi][1] + 0.3) {
              brollOn = Math.min(
                clamp01((t - (BR[bi][0] - 0.3)) / 0.3),
                clamp01((BR[bi][1] + 0.3 - t) / 0.3)
              );
            }
          }
          var tagVis = 1 - brollOn;
          svg.style.opacity = tagVis;

          // etykiety: pozycja z rzutowania 3D; kolejne rozpychane w pionie
          var taken = [];
          tagEls.forEach(function (o) {
            var pp = project(o.p[0], o.p[1], o.p[2]);
            var tx = pp.x + o.off[0],
              ty = pp.y + o.off[1];
            // pas dla etykiet: pod notką, nad blokiem linii; z dala od prawej szyny
            tx = Math.max(130, Math.min(880, tx));
            ty = Math.max(712, Math.min(1150, ty));
            for (var q = 0; q < taken.length; q++) {
              if (Math.abs(taken[q][0] - tx) < 330 && Math.abs(taken[q][1] - ty) < 78) {
                ty = taken[q][1] + 78;
              }
            }
            taken.push([tx, ty]);
            var ap = easeOut(clamp01((t - o.at) / 0.5)) * tagVis;
            o.el.style.left = tx + "px";
            o.el.style.top = ty + "px";
            o.el.style.opacity = ap;
            o.line.setAttribute("d", "M " + tx + " " + ty + " L " + pp.x + " " + pp.y);
            var L = o.line.getTotalLength();
            o.line.style.strokeDasharray = L;
            o.line.style.strokeDashoffset = L * (1 - ap);
            o.dot.setAttribute("cx", pp.x);
            o.dot.setAttribute("cy", pp.y);
            o.dot.setAttribute("opacity", String(clamp01((ap - 0.7) / 0.3)));
          });

          renderer.render(scene, camera);
        }

        /* =====================================================================
           ŹRÓDŁO CZASU: wyłącznie czas kompozycji. Zero zegara, zero rAF,
           więc każda klatka renderu jest powtarzalna.
           ===================================================================== */
        // DOM sterowany jest wprost z frame(t), więc oś GSAP jest pusta.
        // Rejestracja i tak musi być: to ona spina kompozycję z runtime'em.
        window.__timelines["main"] = gsap.timeline({ paused: true });

        window.addEventListener("hf-seek", function (ev) {
          frame(ev.detail.time);
        });
        frame(window.__hfThreeTime || 0);
      })();
    </script>
  </body>
</html>
